<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #fff;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  nav {
    height: 44px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #1d1d1f;
  }
  .hero {
    text-align: center;
    padding: 90px 20px 50px;
  }
  .hero h1 {
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0 0 6px;
    background: linear-gradient(180deg, #1d1d1f 0%, #3a3a3c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p.subhead {
    font-size: clamp(1.1rem, 2.5vw, 1.75rem);
    font-weight: 400;
    color: #86868b;
    margin: 0;
  }
  .hero .buttons {
    margin-top: 20px;
    display: flex;
    gap: 18px;
    justify-content: center;
  }
  .hero .buttons a {
    font-size: 1.05rem;
    color: #06c;
    text-decoration: none;
  }
  .hero .buttons a:hover {
    text-decoration: underline;
  }
  .stage {
    padding: 0 0 100px;
    background: linear-gradient(180deg, #fff 0%, #fbfbfd 100%);
  }
  .stage img {
    display: block;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
  }
  .section {
    text-align: center;
    padding: 80px 20px;
    border-top: 1px solid #f0f0f2;
  }
  .section h2 {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  .section p {
    font-size: 1.2rem;
    color: #86868b;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.5;
  }
  footer {
    text-align: center;
    padding: 30px 20px 50px;
    font-size: 0.72rem;
    color: #86868b;
    border-top: 1px solid #f0f0f2;
  }
  footer a {
    color: #86868b;
  }
</style>
</head>
<body>

  <nav>hello world</nav>

  <section class="hero">
    <h1>Hello, World.</h1>
    <p class="subhead">The first line of code, reimagined.</p>
    <div class="buttons">
      <a href="#details">Learn more ›</a>
    </div>
  </section>

  <div class="stage">
    <img src="les-paul.webp" alt="Close-up of a musician playing a Gibson Les Paul guitar">
  </div>

  <section class="section" id="details">
    <h2>Beautifully simple.</h2>
    <p>Just a page, a guitar, and a greeting. Crafted with the same obsessive attention to whitespace as everything else on this site.</p>
  </section>

</body>
</html>
